name: Standardization evaluator
on:
  push:
    paths:
      - 'experiments/standardization-evaluator/**'
      - '.github/workflows/standardization-evaluator.yml'
  pull_request:
    paths:
      - 'experiments/standardization-evaluator/**'
      - '.github/workflows/standardization-evaluator.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    defaults:
      run:
        working-directory: experiments/standardization-evaluator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s . -p "test_evaluate.py" -v
